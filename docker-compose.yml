services:
  syncd:
    build: .
    command: ./syncd
    env_file: .env
    environment:
      DATA_DIR: /app/data
      SCHEDULE_FEED_FILENAME: /app/data/schedule.json
      LOG_FILENAME: ""
      TD_URL: ${TD_URL:-}
      TD_GROUP: ${TD_GROUP:-}
      TD_USER: ${TD_USER:-}
      TD_PASSWORD: ${TD_PASSWORD:-}
      TD_TOPIC: ${TD_TOPIC:-TD_ALL_SIG_AREA}
    volumes:
      - ../uk-rail-schedule-runtime/data:/app/data
      - /var/run/mysqld:/var/run/mysqld:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3334/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    build: .
    command: ./web
    env_file: .env
    environment:
      DATA_DIR: /app/data
      LISTEN_ON: "0.0.0.0:3333"
      LOG_FILENAME: ""
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - ../uk-rail-schedule-runtime/data:/app/data
      - /var/run/mysqld:/var/run/mysqld:ro
    depends_on:
      syncd:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  update-feed:
    build: .
    command: ./update-schedule-feed.sh
    env_file: .env
    environment:
      SCHEDULE_FEED_FILENAME: /app/data/schedule.json
      LISTEN_ON: "web:3333"
    volumes:
      - ../uk-rail-schedule-runtime/data:/app/data
    depends_on:
      - web
    restart: "no"
    profiles:
      - tools
