services:
  syncd:
    build: .
    command: ./syncd
    env_file: .env
    environment:
      DATA_DIR: /app/data
      SCHEDULE_FEED_FILENAME: /app/data/schedule.json
      LOG_FILENAME: ""
    volumes:
      - ../uk-rail-schedule-runtime/data:/app/data
      - /var/run/mysqld:/var/run/mysqld:ro
    restart: unless-stopped

  web:
    build: .
    command: ./web
    env_file: .env
    environment:
      DATA_DIR: /app/data
      LISTEN_ON: "0.0.0.0:3333"
      LOG_FILENAME: ""
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - ../uk-rail-schedule-runtime/data:/app/data
      - /var/run/mysqld:/var/run/mysqld:ro
    depends_on:
      - syncd
    restart: unless-stopped

  update-feed:
    build: .
    command: ./update-schedule-feed.sh
    env_file: .env
    environment:
      SCHEDULE_FEED_FILENAME: /app/data/schedule.json
      LISTEN_ON: "web:3333"
    volumes:
      - ../uk-rail-schedule-runtime/data:/app/data
    depends_on:
      - web
    restart: "no"
    profiles:
      - tools
